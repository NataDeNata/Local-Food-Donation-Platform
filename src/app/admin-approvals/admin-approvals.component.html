<div class="admin-approvals">
  <h1>Pending Donation Approvals</h1>
  <div *ngIf="loading">Loading...</div>
  <div *ngIf="!loading && pendingDonations.length === 0">No pending donations.</div>
  <table *ngIf="!loading && pendingDonations.length > 0">
    <thead>
      <tr>
        <th>Title</th>
        <th>Description</th>
        <th>Contact</th>
        <th>Posted At</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let d of pendingDonations">
        <td data-label="Title">{{ d.title }}</td>
        <td data-label="Description">{{ d.description }}</td>
        <td data-label="Contact">{{ d.contactName }}<br>{{ d.contactPhone }}</td>
        <td data-label="Posted At">{{ d.postedAt | date:'short' }}</td>
        <td data-label="Actions">
          <button (click)="approve(d)">Approve</button>
          <button (click)="reject(d)">Reject</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
