<form #donationForm="ngForm" (ngSubmit)="submit(donationForm)" novalidate>
  <div class="field">
    <label>Title</label>
    <textarea name="title" [(ngModel)]="model.title" #title="ngModel" required></textarea>
    <div class="error" *ngIf="donationForm.submitted && title.invalid">
      Title is required
    </div>
  </div>

  <div class="field">
    <label>Description</label>
    <textarea name="description" [(ngModel)]="model.description" #description="ngModel" required></textarea>
    <div class="error" *ngIf="donationForm.submitted && description.invalid">
      Description is required
    </div>
  </div>

  <div class="field">
    <label>Quantity</label>
    <input type="number" name="quantity" [(ngModel)]="model.quantity" #quantity="ngModel" required min="1" />
    <div class="error" *ngIf="donationForm.submitted && quantity.invalid">
      Quantity must be at least 1
    </div>
  </div>

  <div class="field">
    <label>Location</label>
    <input id="addressInput"
           name="location"
           [(ngModel)]="model.location"
           #location="ngModel"
           placeholder="Enter donation address"
           required />
    <div class="error" *ngIf="donationForm.submitted && location.invalid">
      Location is required
    </div>
  </div>

  <div class="field">
    <label>Contact Name</label>
    <input name="contactName" [(ngModel)]="model.contactName" #contactName="ngModel" required />
    <div class="error" *ngIf="donationForm.submitted && contactName.invalid">
      Contact name is required
    </div>
  </div>

  <div class="field">
  <label>Contact Phone</label>
  <input name="contactPhone"
         [(ngModel)]="model.contactPhone"
         #contactPhone="ngModel"
         required
        pattern="^[0-9\s-]{10,}$" />
      <div class="error" *ngIf="donationForm.submitted && contactPhone.invalid">
        Contact phone must be at least 10 digits, numbers only
      </div>
</div>


  <!-- Map container -->
  <div id="map" style="height:400px; width:100%; margin-top:20px;"></div>

  <button class="btn" type="submit" [disabled]="donationForm.invalid">Post Donation</button>
  <button class="btn" type="button" (click)="reset()">Reset</button>
</form>
