<div class="barangay-admin-form">
  <h2>Barangay Official Application</h2>
  <form (ngSubmit)="submitForm()" autocomplete="off">
    <div *ngIf="loading" class="loading-overlay">
      <div class="spinner"></div>
      <div style="text-align:center;margin-top:1em;">Submitting your request...</div>
    </div>
    <div [class.blur]="loading">
      <div class="field">
        <label>Name</label>
        <input [(ngModel)]="name" name="name" required />
      </div>
      <div class="field">
        <label>Email</label>
        <input [(ngModel)]="email" name="email" type="email" required />
      </div>
      <div class="field">
        <label>Barangay</label>
        <select [(ngModel)]="barangay" name="barangay" required>
          <option value="" disabled selected>Select Barangay</option>
          <option *ngFor="let b of barangays" [value]="b">{{ b }}</option>
        </select>
      </div>
      <div class="field">
        <label>Position</label>
        <input [(ngModel)]="position" name="position" required />
      </div>
      <div class="field">
        <label>Contact Number</label>
        <input [(ngModel)]="contact" name="contact" required />
      </div>
      <div class="field">
        <label>Attach Barangay Certificate (PDF only)</label>
        <input type="file" (change)="onPdfChange($event)" accept="application/pdf" required />
      </div>
      <div class="field">
        <label>Attach Photos (JPG, PNG, etc.)</label>
        <input type="file" (change)="onPhotosChange($event)" accept="image/*" multiple required />
      </div>
      <button type="submit" class="btn" [disabled]="loading">Submit Request</button>
      <div *ngIf="submitted" class="success-message" style="margin-top:1em;color:#22c55e;">
        Your application has been submitted!
      </div>
    </div>
  </form>
</div>

<style>
.loading-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.8);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
.blur {
  filter: blur(2px);
  pointer-events: none;
}
.spinner {
  border: 6px solid #e5e7eb;
  border-top: 6px solid #6d28d9;
  border-radius: 50%;
  width: 48px;
  height: 48px;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
