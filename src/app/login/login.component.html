<div class="login-container">
  <div class="login-card">
    <h1 class="title">{{ isSignup() ? 'Create Account' : 'Login' }}</h1>
    
    <form (ngSubmit)="submit()" class="form">
      <div class="field">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="Enter your email" required [readonly]="adminRequestSent"/>
      </div>

      <div class="field" *ngIf="isSignup()">
        <label>Role</label>
        <select [(ngModel)]="role" name="role" required [disabled]="adminRequestSent">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <!-- Password input logic -->
      <div class="field" *ngIf="!isSignup()">
        <label>Password</label>
        <div style="position:relative;">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            required
            style="padding-right:2.5rem;"
          />
          <button
            *ngIf="password"
            type="button"
            (click)="showPassword.set(!showPassword())"
            tabindex="-1"
            style="position:absolute;right:0.5rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;">
            <!-- Eye icon (show password) -->
            <svg *ngIf="!showPassword()" width="22" height="22" viewBox="0 0 24 24" fill="none"
              [attr.stroke]="themeService.theme() === 'dark' ? '#fff' : 'currentColor'"
              stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path> <!--svg format-->
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- Eye-off icon (hide password) -->
            <svg *ngIf="showPassword()" width="22" height="22" viewBox="0 0 24 24" fill="none"
              [attr.stroke]="themeService.theme() === 'dark' ? '#fff' : 'currentColor'"
              stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>
      <div class="field" *ngIf="isSignup() && role !== 'admin'">
        <label>Password</label>
        <div style="position:relative;">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            required
            style="padding-right:2.5rem;"
          />
          <button
            *ngIf="password"
            type="button"
            (click)="showPassword.set(!showPassword())"
            tabindex="-1"
            style="position:absolute;right:0.5rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;">
            <!-- Eye icon (show password) -->
            <svg *ngIf="!showPassword()" width="22" height="22" viewBox="0 0 24 24" fill="none"
              [attr.stroke]="themeService.theme() === 'dark' ? '#fff' : 'currentColor'"
              stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- Eye-off icon (hide password) -->
            <svg *ngIf="showPassword()" width="22" height="22" viewBox="0 0 24 24" fill="none"
              [attr.stroke]="themeService.theme() === 'dark' ? '#fff' : 'currentColor'"
              stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>
      <div class="field" *ngIf="isSignup() && role !== 'admin'">
        <label>Confirm Password</label>
        <div style="position:relative;">
          <input
            [type]="showConfirmPassword() ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm your password"
            required
            style="padding-right:2.5rem;"
          />
          <button
            *ngIf="confirmPassword"
            type="button"
            (click)="showConfirmPassword.set(!showConfirmPassword())"
            tabindex="-1"
            style="position:absolute;right:0.5rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;">
            <!-- Eye icon (show password) -->
            <svg *ngIf="!showConfirmPassword()" width="22" height="22" viewBox="0 0 24 24" fill="none"
              [attr.stroke]="themeService.theme() === 'dark' ? '#fff' : 'currentColor'"
              stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- Eye-off icon (hide password) -->
            <svg *ngIf="showConfirmPassword()" width="22" height="22" viewBox="0 0 24 24" fill="none"
              [attr.stroke]="themeService.theme() === 'dark' ? '#fff' : 'currentColor'"
              stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>
      <div *ngIf="passwordMismatch" class="error-message">
        Passwords do not match.
      </div>

      <div *ngIf="authService.error()" class="error-message">
        {{ authService.error() }}
      </div>

      <div *ngIf="adminRequestSent" class="error-message" style="color: #10b981;">
        Admin signup request noted! Please contact the site owner for approval. No account has been created.
      </div>

      <button type="submit" class="btn" [disabled]="authService.isLoading() || (isSignup() && role === 'admin' && adminRequestSent)">
        {{ authService.isLoading() ? 'Loading...' : (isSignup() ? (role === 'admin' ? 'Request Admin' : 'Sign Up') : 'Login') }}
      </button>
    </form>

    <p class="toggle-text">
      {{ isSignup() ? 'Already have an account?' : "Don't have an account?" }}
      <button type="button" class="link-btn" (click)="toggleSignup()">
        {{ isSignup() ? 'Login' : 'Sign Up' }}
      </button>
    </p>
  </div>
</div>
