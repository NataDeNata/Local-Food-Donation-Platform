<header class="header">
  <nav class="nav">
    <a routerLink="/" class="brand">Libreng Kain</a>
    <button class="hamburger" type="button" (click)="toggleMobileMenu()" aria-label="Toggle navigation">
      <span [class.open]="mobileMenuOpen()"></span>
      <span [class.open]="mobileMenuOpen()"></span>
      <span [class.open]="mobileMenuOpen()"></span>
    </button>
    <div class="nav-links" [class.open]="mobileMenuOpen()">
      <a routerLink="/" class="link">Donations</a>
      <a routerLink="/home" class="link">Home</a>
      <a *ngIf="authService.user() && authService.userRole() !== 'admin'" routerLink="/new" class="button">Post Donation</a>
      <a
        *ngIf="authService.user() && authService.user()?.email === 'ynatz.ynatz@gmail.com'"
        routerLink="/admin-dashboard"
        class="button"
      >Admin Dashboard</a>
      <a
        *ngIf="authService.user() && authService.userRole() === 'admin'"
        routerLink="/admin-approvals"
        class="button"
      >Donation Approvals</a>
      
      <div class="user-section" *ngIf="authService.user() as user">
        <span class="user-email">{{ user.email }}</span>
        <button class="logout-btn" (click)="logout()">Logout</button>
      </div>
      
      <a *ngIf="!authService.user()" routerLink="/login" class="button">Login</a>

     <!--Light/Dark switch-->
      <label class="switch">
        <input
          class="switch__input"
          type="checkbox"
          role="switch"
          [checked]="themeService.theme() === 'dark'"
          (change)="toggleTheme()"
          aria-label="Toggle dark mode"
        />
        <!-- Use consistent viewBox for both icons to avoid clipping -->
        <svg class="switch__icon switch__icon--light" viewBox="0 0 12 12" width="12px" height="12px" aria-hidden="true">
          <g fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round">
            <circle cx="6" cy="6" r="2" />
            <g stroke-dasharray="1.5 1.5">
              <polyline points="6 10,6 11.5" transform="rotate(0,6,6)" />
              <polyline points="6 10,6 11.5" transform="rotate(45,6,6)" />
              <polyline points="6 10,6 11.5" transform="rotate(90,6,6)" />
              <polyline points="6 10,6 11.5" transform="rotate(135,6,6)" />
              <polyline points="6 10,6 11.5" transform="rotate(180,6,6)" />
              <polyline points="6 10,6 11.5" transform="rotate(225,6,6)" />
              <polyline points="6 10,6 11.5" transform="rotate(270,6,6)" />
              <polyline points="6 10,6 11.5" transform="rotate(315,6,6)" />
            </g>
          </g>
        </svg>
        <svg class="switch__icon switch__icon--dark" viewBox="0 0 12 12" width="12px" height="12px" aria-hidden="true">
          <g fill="none" stroke="#fff" stroke-width="1" stroke-linejoin="round" transform="rotate(-45,6,6)">
            <path d="m9,10c-2.209,0-4-1.791-4-4s1.791-4,4-4c.304,0,.598.041.883.105-.995-.992-2.367-1.605-3.883-1.605C2.962.5.5,2.962.5,6s2.462,5.5,5.5,5.5c1.516,0,2.888-.613,3.883-1.605-.285.064-.578.105-.883.105Z"/>
          </g>	
        </svg>
        <span class="switch__sr">Dark Mode</span>
      </label>

      <!-- Chat icon with notification badge -->
      <button
        *ngIf="authService.user()"
        class="chat-btn"
        title="Chat"
        (click)="openChatSidebar()"
      >
        <span style="font-size:1.3em;">💬</span>
        <span
          *ngIf="unreadChatsCount() > 0"
          class="chat-notif-badge"
        >
          {{ unreadChatsCount() }}
        </span>
      </button>
    </div>
  </nav>
</header>

<main class="container">
  <div *ngIf="loading()" class="page-loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Loading...</div>
  </div>
  <router-outlet *ngIf="!loading()" />
</main>

<footer class="footer">
  <small>Made for community sharing.</small>
  <div style="margin-top:0.5em;">
    <a routerLink="/about" class="footer-link">About</a>
    &nbsp;|&nbsp;
    <a routerLink="/contact" class="footer-link">Contact</a>
  </div>
</footer>

<!-- Chat Sidebar Overlay -->
<div
  *ngIf="showChatSidebar()"
  class="chat-sidebar-overlay"
  (click)="closeChatSidebar()"
  style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1001;background:rgba(0,0,0,0.2);"
>
  <div
    class="chat-sidebar"
    (click)="$event.stopPropagation()"
    style="position:fixed;top:0;left:0;height:100vh;width:340px;max-width:90vw;background:#fff;box-shadow:2px 0 16px rgba(0,0,0,0.12);z-index:1002;display:flex;flex-direction:column;"
  >
    <div style="display:flex;align-items:center;justify-content:space-between;padding:1rem 1rem 0 1rem;">
      <span style="font-weight:bold;font-size:1.2em;">Chat</span>
      <button (click)="closeChatSidebar()" style="background:none;border:none;font-size:1.5em;cursor:pointer;">×</button>
    </div>
    <div style="flex:1;overflow-y:auto;">
      <chat-list-sidebar></chat-list-sidebar>
    </div>
  </div>
</div>
